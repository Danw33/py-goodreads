name: Bug report
description: Report a reproducible py-goodreads problem
body:
  - type: markdown
    attributes:
      value: >-
        This is unofficial community software. Do not contact Goodreads support
        about this client. Remove cookies and personal reading data from logs.
  - type: input
    id: version
    attributes:
      label: py-goodreads version
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted traceback or logs
      render: text
